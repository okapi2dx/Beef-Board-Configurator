name: One-shot Angle Deadzone Build

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-angle-deadzone-build.yml

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Test turntable gate
        working-directory: fw
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/turntable_gate_test.cpp -o /tmp/turntable_gate_test
          /tmp/turntable_gate_test
      - name: Install AVR-GCC 14.1.0
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --retry 3 -o /tmp/avr-gcc.tar.bz2 \
            https://github.com/ZakKemble/avr-gcc-build/releases/download/v14.1.0-1/avr-gcc-14.1.0-x64-linux.tar.bz2
          mkdir -p "$HOME/avr-gcc"
          tar -xjf /tmp/avr-gcc.tar.bz2 -C "$HOME/avr-gcc" --strip-components=1
          echo "$HOME/avr-gcc/bin" >> "$GITHUB_PATH"
      - name: Toolchain version
        run: avr-gcc --version
      - name: Build firmware
        working-directory: fw
        run: make -j2
      - uses: actions/upload-artifact@v4
        with:
          name: beef-firmware
          path: fw/beef.hex
          if-no-files-found: error
          retention-days: 1

  app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            beef-config/package-lock.json
            desktop/package-lock.json
      - name: Version check
        run: node scripts/sync-version.mjs --check
      - name: Install configurator
        working-directory: beef-config
        run: npm ci
      - name: Svelte check
        working-directory: beef-config
        run: npm run check
      - name: UI tests
        working-directory: beef-config
        run: npm test
      - name: Build configurator
        working-directory: beef-config
        run: npm run build
      - name: Install desktop
        working-directory: desktop
        run: npm ci
      - name: Desktop tests
        working-directory: desktop
        run: npm test
      - name: Main syntax check
        working-directory: desktop
        run: node --check main.cjs
      - name: Build portable EXE
        working-directory: desktop
        run: npm run dist
      - name: Smoke launch packaged EXE
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path ../../outputs/build -Filter *.exe -Recurse | Where-Object { $_.DirectoryName -notlike '*win-unpacked*' } | Select-Object -First 1
          if (-not $exe) { throw "Portable EXE not found" }
          $env:BEEF_TEST_USER_DATA = "$env:RUNNER_TEMP\beef-smoke"
          $p = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "Portable EXE exited during startup with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
      - name: Collect EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          $exe = Get-ChildItem -Path ../../outputs/build -Filter *.exe -Recurse | Where-Object { $_.DirectoryName -notlike '*win-unpacked*' } | Select-Object -First 1
          Copy-Item $exe.FullName artifact/
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable-exe
          path: artifact/*.exe
          if-no-files-found: error
          retention-days: 1
