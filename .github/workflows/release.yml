name: Release

on:
  push:
    branches: [main]
    paths:
      - VERSION
      - .github/workflows/release.yml
      - scripts/sync-version.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows portable app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            beef-config/package-lock.json
            desktop/package-lock.json
      - name: Check synchronized version
        run: node scripts/sync-version.mjs --check
      - name: Install configurator dependencies
        working-directory: beef-config
        run: npm ci
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Build portable EXE
        working-directory: desktop
        run: npm run dist
      - name: Collect EXE
        shell: pwsh
        working-directory: desktop
        run: |
          New-Item -ItemType Directory -Force -Path ../release | Out-Null
          $exe = Get-ChildItem -Path ../../../outputs/build -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "Portable EXE was not produced" }
          Copy-Item $exe.FullName ../release/
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/*.exe
          if-no-files-found: error

  firmware:
    name: Build firmware HEX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install AVR GCC 14.1.0
        run: |
          sudo apt-get update
          sudo apt-get install -y make curl bzip2
          curl -L https://github.com/ZakKemble/avr-gcc-build/releases/download/v14.1.0-1/avr-gcc-14.1.0-x64-linux.tar.bz2 -o /tmp/avr-gcc.tar.bz2
          sudo mkdir -p /opt/avr-gcc
          sudo tar -xjf /tmp/avr-gcc.tar.bz2 -C /opt/avr-gcc --strip-components=1
          echo "/opt/avr-gcc/bin" >> "$GITHUB_PATH"
          /opt/avr-gcc/bin/avr-gcc --version
      - name: Build firmware
        working-directory: fw
        run: make
      - name: Collect HEX
        run: |
          mkdir -p release
          VERSION="$(cat VERSION)"
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          DISPLAY="V${MAJOR}.$(printf '%02d' "$MINOR").${PATCH}"
          cp fw/beef.hex "release/Beef-Board-Firmware-${DISPLAY}.hex"
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: release/*.hex
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [windows, firmware]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Resolve release version
        run: |
          VERSION="$(cat VERSION)"
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          TAG="V${MAJOR}.$(printf '%02d' "$MINOR").${PATCH}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --target "$GITHUB_SHA" --title "Beef Board Configurator $TAG" --generate-notes
          fi
