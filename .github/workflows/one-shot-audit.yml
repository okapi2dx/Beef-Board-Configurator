name: One-shot Full Audit Final

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-audit.yml

permissions:
  contents: read

jobs:
  dependency-details:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Configurator vulnerability details
        working-directory: beef-config
        shell: bash
        run: |
          npm ci
          npm audit --json > /tmp/audit.json || true
          node - <<'NODE'
          const a=require('/tmp/audit.json');
          console.log('SUMMARY', a.metadata?.vulnerabilities);
          for (const [name,v] of Object.entries(a.vulnerabilities||{})) {
            console.log(JSON.stringify({name,severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable,via:(v.via||[]).map(x=>typeof x==='string'?x:{source:x.source,name:x.name,severity:x.severity,title:x.title,url:x.url,range:x.range})},null,2));
          }
          NODE

  smoke-inventory:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install and build UI
        working-directory: beef-config
        run: |
          npm ci
          npm run build
      - name: Install desktop
        working-directory: desktop
        run: npm ci
      - name: Install Playwright browser
        working-directory: desktop
        run: npx playwright install msedge
      - name: Run browser smoke files individually
        working-directory: desktop
        shell: pwsh
        run: |
          $tests = @(
            "features-smoke.cjs",
            "button-mapping-smoke.cjs",
            "controller-monitor-response-smoke.cjs",
            "turntable-test-smoke.cjs"
          )
          foreach ($test in $tests) {
            Write-Host "=== $test ==="
            node $test
            Write-Host "EXIT=$LASTEXITCODE"
            if ($LASTEXITCODE -ne 0) { Write-Host "FAILED_SMOKE=$test" }
          }
          exit 0
