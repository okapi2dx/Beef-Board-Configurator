name: One-shot Full Audit Follow-up

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-audit.yml

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Precise structure audit
        shell: bash
        run: |
          python3 - <<'PY'
          import os, subprocess, json, re
          files=subprocess.check_output(["git","-c","core.quotePath=false","ls-files"],text=True).splitlines()
          print("NON_ASCII")
          for p in files:
            if any(ord(c)>127 for c in p): print(p)
          print("\nTOP_LEVEL_SVELTE_REFERENCE_COUNTS")
          allsrc={}
          for p in files:
            if p.startswith("beef-config/src/") and p.endswith((".svelte",".ts",".js")):
              try: allsrc[p]=open(p,encoding="utf-8").read()
              except: pass
          for p in sorted(x for x in allsrc if x.startswith("beef-config/src/lib/") and x.count("/")==3 and x.endswith(".svelte")):
            base=os.path.basename(p)
            refs=[q for q,b in allsrc.items() if q!=p and base in b]
            print(p, "refs=",len(refs), *refs)
          print("\nFW_SDVX_FILES")
          for p in files:
            if p.startswith("fw/devices/sdvx/"): print(p)
          mk=open("fw/makefile",encoding="utf-8").read()
          print("SDVX_COMPILED_BY_MAKEFILE", "devices/sdvx" in mk)
          print("\nVERSIONS")
          print("VERSION",open("VERSION").read().strip())
          for p in ["beef-config/package.json","desktop/package.json","fw/version.mk"]:
            print(p,open(p,encoding="utf-8").read().splitlines()[:8])
          PY

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Configurator audit
        working-directory: beef-config
        shell: bash
        run: |
          npm ci
          npm audit --json > /tmp/config-audit.json || true
          node -e "const a=require('/tmp/config-audit.json'); console.log(JSON.stringify(a.metadata?.vulnerabilities||{},null,2))"
      - name: Desktop audit
        working-directory: desktop
        shell: bash
        run: |
          npm ci
          npm audit --json > /tmp/desktop-audit.json || true
          node -e "const a=require('/tmp/desktop-audit.json'); console.log(JSON.stringify(a.metadata?.vulnerabilities||{},null,2))"

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Run every host firmware test
        shell: bash
        run: |
          set -e
          for src in fw/tests/*_test.cpp; do
            exe="/tmp/$(basename "$src" .cpp)"
            echo "=== $src ==="
            g++ -std=c++17 -Wall -Wextra -pedantic "$src" -o "$exe"
            "$exe"
          done
      - name: Install AVR-GCC 14.1.0
        shell: bash
        run: |
          curl -L --retry 3 -o /tmp/avr-gcc.tar.bz2 https://github.com/ZakKemble/avr-gcc-build/releases/download/v14.1.0-1/avr-gcc-14.1.0-x64-linux.tar.bz2
          mkdir -p "$HOME/avr-toolchain"
          tar -xjf /tmp/avr-gcc.tar.bz2 -C "$HOME/avr-toolchain"
          AVR_GCC="$(find "$HOME/avr-toolchain" -type f -name avr-gcc -print -quit)"
          test -n "$AVR_GCC"
          echo "$(dirname "$AVR_GCC")" >> "$GITHUB_PATH"
          "$AVR_GCC" --version
      - name: AVR firmware build
        working-directory: fw
        run: make clean && make
