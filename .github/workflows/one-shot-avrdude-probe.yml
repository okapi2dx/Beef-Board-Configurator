name: One-shot AVRDUDE Version Probe
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-avrdude-probe.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: AVRDUDE version
        shell: pwsh
        run: |
          & .\beef-tool\avrdude\avrdude.exe --version
