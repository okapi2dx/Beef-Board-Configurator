name: One-shot Compact Tooltip Portable Build

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-tooltip-compact-portable.yml

permissions:
  contents: read

jobs:
  app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            beef-config/package-lock.json
            desktop/package-lock.json
      - name: Version check
        run: node scripts/sync-version.mjs --check
      - name: Install configurator
        working-directory: beef-config
        run: npm ci
      - name: Svelte check
        working-directory: beef-config
        run: npm run check
      - name: UI tests
        working-directory: beef-config
        run: npm test
      - name: Build configurator
        working-directory: beef-config
        run: npm run build
      - name: Install desktop
        working-directory: desktop
        run: npm ci
      - name: Desktop tests
        working-directory: desktop
        run: npm test
      - name: Main syntax check
        working-directory: desktop
        run: node --check main.cjs
      - name: Build portable EXE
        working-directory: desktop
        run: npm run dist
      - name: Smoke launch packaged EXE
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path ../../outputs/build -Filter *.exe -Recurse | Where-Object { $_.DirectoryName -notlike '*win-unpacked*' } | Select-Object -First 1
          if (-not $exe) { throw "Portable EXE not found" }
          $env:BEEF_TEST_USER_DATA = "$env:RUNNER_TEMP\beef-smoke"
          $p = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "Portable EXE exited during startup with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
      - name: Collect EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          $exe = Get-ChildItem -Path ../../outputs/build -Filter *.exe -Recurse | Where-Object { $_.DirectoryName -notlike '*win-unpacked*' } | Select-Object -First 1
          Copy-Item $exe.FullName artifact/
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable-exe
          path: artifact/*.exe
          if-no-files-found: error
          retention-days: 1
