name: One-shot Dependency Refresh

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-build.yml

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Refresh and verify dependencies
        working-directory: beef-config
        shell: bash
        run: |
          npm update --package-lock-only
          npm ci
          npm run check
          npm run test
          npm run build
          npm audit --json > audit.json || true
          node -e "const a=require('./audit.json'); console.log('AUDIT', JSON.stringify(a.metadata?.vulnerabilities||{})); if ((a.metadata?.vulnerabilities?.total||0)!==0) process.exit(2)"
      - uses: actions/upload-artifact@v4
        with:
          name: refreshed-beef-config-deps
          path: |
            beef-config/package.json
            beef-config/package-lock.json
            beef-config/audit.json
          if-no-files-found: error
          retention-days: 1
