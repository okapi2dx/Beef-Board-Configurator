name: One-shot Dependency Probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-build.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Probe current package releases
        working-directory: beef-config
        shell: bash
        run: |
          echo "KIT=$(npm view @sveltejs/kit version)"
          echo "ADAPTER_STATIC=$(npm view @sveltejs/adapter-static version)"
          echo "ADAPTER_AUTO=$(npm view @sveltejs/adapter-auto version)"
          echo "SVELTE=$(npm view svelte version)"
          echo "VITE=$(npm view vite version)"
          echo "TYPESCRIPT=$(npm view typescript version)"
