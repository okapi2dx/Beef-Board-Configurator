name: One-shot Version Validation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-build.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            beef-config/package-lock.json
            desktop/package-lock.json
      - name: Check synchronized version
        run: node scripts/sync-version.mjs --check
      - name: Install configurator dependencies
        working-directory: beef-config
        run: npm ci
      - name: Svelte check
        working-directory: beef-config
        run: npm run check
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Desktop tests
        working-directory: desktop
        run: npm test

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install AVR-GCC 14.1.0
        shell: bash
        run: |
          curl -L --retry 3 -o /tmp/avr-gcc.tar.bz2 https://github.com/ZakKemble/avr-gcc-build/releases/download/v14.1.0-1/avr-gcc-14.1.0-x64-linux.tar.bz2
          mkdir -p "$HOME/avr-toolchain"
          tar -xjf /tmp/avr-gcc.tar.bz2 -C "$HOME/avr-toolchain"
          AVR_GCC="$(find "$HOME/avr-toolchain" -type f -name avr-gcc -print -quit)"
          test -n "$AVR_GCC"
          echo "$(dirname "$AVR_GCC")" >> "$GITHUB_PATH"
      - name: Build firmware
        working-directory: fw
        run: make
