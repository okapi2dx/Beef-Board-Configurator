name: One-shot Prettier Probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-build.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Inspect formatter dependency versions
        working-directory: beef-config
        shell: bash
        run: |
          npm ci
          npm ls prettier prettier-plugin-svelte prettier-plugin-tailwindcss svelte --depth=0 || true
          echo "PRETTIER_LATEST=$(npm view prettier version)"
          echo "SVELTE_PLUGIN_LATEST=$(npm view prettier-plugin-svelte version)"
          echo "TAILWIND_PLUGIN_LATEST=$(npm view prettier-plugin-tailwindcss version)"
