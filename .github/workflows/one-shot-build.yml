name: One-shot Formatter Dependency Commit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-build.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Refresh lockfile and verify dependencies
        working-directory: beef-config
        shell: bash
        run: |
          npm install --package-lock-only
          npm ci
          npm run check
          npx eslint .
          npm run test
          npm run build
          npm audit --json > /tmp/audit.json || true
          node -e "const a=require('/tmp/audit.json'); console.log('AUDIT', JSON.stringify(a.metadata?.vulnerabilities||{})); if ((a.metadata?.vulnerabilities?.total||0)!==0) process.exit(2)"
      - name: Commit lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beef-config/package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes"
          else
            git commit -m "Refresh formatter dependencies"
            git push origin HEAD:main
          fi
