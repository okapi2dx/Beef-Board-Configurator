name: One-shot App and Firmware Build

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-build.yml

permissions:
  contents: read

jobs:
  firmware:
    name: Build firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install AVR-GCC 14.1.0
        shell: bash
        run: |
          curl -L --retry 3 -o /tmp/avr-gcc.tar.bz2 https://github.com/ZakKemble/avr-gcc-build/releases/download/v14.1.0-1/avr-gcc-14.1.0-x64-linux.tar.bz2
          mkdir -p "$HOME/avr-toolchain"
          tar -xjf /tmp/avr-gcc.tar.bz2 -C "$HOME/avr-toolchain"
          AVR_GCC="$(find "$HOME/avr-toolchain" -type f -name avr-gcc -print -quit)"
          test -n "$AVR_GCC"
          AVR_BIN="$(dirname "$AVR_GCC")"
          echo "$AVR_BIN" >> "$GITHUB_PATH"
          "$AVR_GCC" --version
      - name: Host firmware tests
        shell: bash
        run: |
          set -e
          for src in fw/tests/*_test.cpp; do
            exe="/tmp/$(basename "$src" .cpp)"
            g++ -std=c++17 -Wall -Wextra -pedantic "$src" -o "$exe"
            "$exe"
          done
      - name: Build firmware
        working-directory: fw
        run: make clean && make
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-hex
          path: fw/beef.hex
          if-no-files-found: error
          retention-days: 1

  windows-artifact:
    name: Build Windows portable EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            beef-config/package-lock.json
            desktop/package-lock.json
      - name: Check synchronized version
        run: node scripts/sync-version.mjs --check
      - name: Install configurator dependencies
        working-directory: beef-config
        run: npm ci
      - name: Svelte check
        working-directory: beef-config
        run: npm run check
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Desktop tests
        working-directory: desktop
        run: npm test
      - name: Build portable EXE
        working-directory: desktop
        run: npm run dist
      - name: Collect portable EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          $exe = Get-ChildItem -Path ../../outputs/build -Filter *.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Portable EXE was not produced" }
          Copy-Item $exe.FullName artifact/
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable-exe
          path: artifact/*.exe
          if-no-files-found: error
          retention-days: 1
