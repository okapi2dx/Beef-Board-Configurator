name: One-shot Final V1.00 Build

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-build.yml

permissions:
  contents: read

jobs:
  hygiene:
    name: Check repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check stale labels and residual files
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re, subprocess, sys
          files=subprocess.check_output(["git","-c","core.quotePath=false","ls-files"],text=True).splitlines()
          bad_names=[p for p in files if any(ord(c)>127 for c in p)]
          removed={
            "beef-config/src/lib/ButtonLedIndividual.svelte",
            "beef-config/src/lib/InputDiagnostics.svelte",
            "beef-config/src/lib/LedPresets.svelte",
            "beef-config/src/lib/Profiles.svelte",
            "desktop/features-smoke.cjs",
          }
          leftovers=sorted(removed.intersection(files))
          patterns=[
            (re.compile(r'firmware\s+1\.10\.[01]',re.I),"old firmware 1.10 label"),
            (re.compile(r'V1\.01\.0',re.I),"old V1.01.0 label"),
            (re.compile(r'(settings-(?:input|led)|controller-monitor)-1\.10',re.I),"old screenshot name"),
          ]
          hits=[]
          text_ext={'.md','.txt','.js','.mjs','.cjs','.ts','.svelte','.css','.json','.c','.cpp','.h','.mk','.py','.bat'}
          for p in files:
            if p.startswith(("fw/LUFA/","fw/FastLED/")): continue
            if os.path.splitext(p)[1].lower() not in text_ext and p!="VERSION": continue
            try: s=open(p,encoding="utf-8").read()
            except: continue
            for pat,label in patterns:
              for m in pat.finditer(s):
                hits.append((p,s.count("\n",0,m.start())+1,label,m.group(0)))
          if bad_names or leftovers or hits:
            print("NON_ASCII",bad_names)
            print("REMOVED_FILES_STILL_PRESENT",leftovers)
            for h in hits: print("STALE",*h)
            sys.exit(1)
          print("Repository hygiene checks passed")
          PY

  app:
    name: Validate configurator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: beef-config/package-lock.json
      - name: Check synchronized version
        run: node scripts/sync-version.mjs --check
      - name: Install configurator dependencies
        working-directory: beef-config
        run: npm ci
      - name: Dependency audit
        working-directory: beef-config
        run: npm audit
      - name: Svelte check
        working-directory: beef-config
        run: npm run check
      - name: UI logic tests
        working-directory: beef-config
        run: npm test
      - name: Production build
        working-directory: beef-config
        run: npm run build

  firmware:
    name: Build firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Host firmware tests
        shell: bash
        run: |
          set -e
          for src in fw/tests/*_test.cpp; do
            exe="/tmp/$(basename "$src" .cpp)"
            g++ -std=c++17 -Wall -Wextra -pedantic "$src" -o "$exe"
            "$exe"
          done
      - name: Install AVR-GCC 14.1.0
        shell: bash
        run: |
          curl -L --retry 3 -o /tmp/avr-gcc.tar.bz2 https://github.com/ZakKemble/avr-gcc-build/releases/download/v14.1.0-1/avr-gcc-14.1.0-x64-linux.tar.bz2
          mkdir -p "$HOME/avr-toolchain"
          tar -xjf /tmp/avr-gcc.tar.bz2 -C "$HOME/avr-toolchain"
          AVR_GCC="$(find "$HOME/avr-toolchain" -type f -name avr-gcc -print -quit)"
          test -n "$AVR_GCC"
          echo "$(dirname "$AVR_GCC")" >> "$GITHUB_PATH"
          "$AVR_GCC" --version
      - name: Build firmware
        working-directory: fw
        run: make clean && make
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-hex
          path: fw/beef.hex
          if-no-files-found: error
          retention-days: 1

  windows:
    name: Build Windows portable EXE
    runs-on: windows-latest
    needs: [hygiene, app]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            beef-config/package-lock.json
            desktop/package-lock.json
      - name: Check synchronized version
        run: node scripts/sync-version.mjs --check
      - name: Install configurator dependencies
        working-directory: beef-config
        run: npm ci
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Desktop dependency audit
        working-directory: desktop
        run: npm audit
      - name: Desktop tests
        working-directory: desktop
        run: npm test
      - name: Build portable EXE
        working-directory: desktop
        run: npm run dist
      - name: Collect portable EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          $exe = Get-ChildItem -Path ../../outputs/build -Filter *.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Portable EXE was not produced" }
          Copy-Item $exe.FullName artifact/
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable-exe
          path: artifact/*.exe
          if-no-files-found: error
          retention-days: 1
