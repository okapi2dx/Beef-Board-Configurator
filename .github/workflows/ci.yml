name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    name: Configurator and desktop tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            beef-config/package-lock.json
            desktop/package-lock.json
      - name: Check synchronized version
        run: node scripts/sync-version.mjs --check
      - name: Install configurator dependencies
        working-directory: beef-config
        run: npm ci
      - name: Svelte check
        working-directory: beef-config
        run: npm run check
      - name: Configurator tests
        working-directory: beef-config
        run: |
          npm run test:bar-color
          npm run test:key-mapping
          node --conditions=browser led-emulator.test.mjs
      - name: Build configurator
        working-directory: beef-config
        run: npm run build
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Desktop tests
        working-directory: desktop
        run: npm test

  firmware-host-tests:
    name: Firmware host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run host-side tests
        working-directory: fw
        run: |
          set -e
          for test in \
            tests/debounce_test.cpp \
            tests/encoder_position_test.cpp \
            tests/analog_turntable_test.cpp \
            tests/button_led_envelope_test.cpp \
            tests/smooth_rainbow_test.cpp \
            tests/turntable_delay_test.cpp \
            tests/turntable_gate_test.cpp
          do
            exe="/tmp/$(basename "$test" .cpp)"
            g++ -std=c++17 -O2 "$test" -o "$exe"
            "$exe"
          done

  firmware-build:
    name: AVR firmware build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install AVR GCC 14.1.0
        run: |
          sudo apt-get update
          sudo apt-get install -y make curl bzip2
          curl -L https://github.com/ZakKemble/avr-gcc-build/releases/download/v14.1.0-1/avr-gcc-14.1.0-x64-linux.tar.bz2 -o /tmp/avr-gcc.tar.bz2
          sudo mkdir -p /opt/avr-gcc
          sudo tar -xjf /tmp/avr-gcc.tar.bz2 -C /opt/avr-gcc --strip-components=1
          echo "/opt/avr-gcc/bin" >> "$GITHUB_PATH"
          /opt/avr-gcc/bin/avr-gcc --version
      - name: Build firmware
        working-directory: fw
        run: make


  windows-artifact:
    name: Build Windows portable EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            beef-config/package-lock.json
            desktop/package-lock.json
      - name: Check synchronized version
        run: node scripts/sync-version.mjs --check
      - name: Install configurator dependencies
        working-directory: beef-config
        run: npm ci
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Build portable EXE
        working-directory: desktop
        run: npm run dist
      - name: Collect portable EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          $exe = Get-ChildItem -Path ../../outputs/build -Filter *.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Portable EXE was not produced" }
          Copy-Item $exe.FullName artifact/
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable-exe
          path: artifact/*.exe
          if-no-files-found: error
          retention-days: 30
